name: Notion Docs Sync

on:
  push:
    paths:
      - 'docs/en/**'
      - 'docs/es/**'
      - 'scripts/sync-docs-to-notion.mjs'
      - 'docs/.notion-sync.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync docs to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DOCS_ROOT_PAGE_ID: ${{ secrets.NOTION_DOCS_ROOT_PAGE_ID }}
        run: npm run sync:docs-notion

      - name: Commit manifest updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/.notion-sync.json
          if git diff --staged --quiet; then
            echo "No manifest changes"
          else
            git commit -m "chore: update Notion docs sync manifest"
            git push
          fi
